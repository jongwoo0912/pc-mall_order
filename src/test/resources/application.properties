spring.application.name=pc_product

# Tests run against in-memory H2 (MySQL mode) so they don't need a MySQL server
spring.datasource.url=jdbc:h2:mem:pctest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
