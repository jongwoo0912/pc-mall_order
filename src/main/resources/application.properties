spring.application.name=pc_product

# Actuator: health check endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# DataSource (MySQL) - override with env vars DB_URL / DB_USERNAME / DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dbdemoboot?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:demoboot}
spring.datasource.password=${DB_PASSWORD:demo1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Upload limits for product images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
